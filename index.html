.btn.alt{background:var(--card);color:var(--fg)}

.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;width:100%;max-width:380px;font-size:13px;text-align:left;box-sizing:border-box}
.item button{background:var(--acc);border:0;border-radius:16px;padding:8px 12px;font-weight:700;white-space:nowrap}
.item button:disabled{opacity:.4}
.rb{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%;border:3px solid #fff;color:#222;font-weight:800;font-size:14px}

.hide{display:none!important}

'Gianluigi Donnarumma|Erling Haaland|Phil Foden|Rodri|Bernardo Silva|Joško Gvardiol|Rúben Dias|Jérémy Doku|Tijjani Reijnders|Rayan Cherki|Nico O’Reilly|Matheus Nunes|Savinho|Marc Guéhi|Omar Marmoush',
'Manuel Neuer|Harry Kane|Jamal Musiala|Michael Olise|Joshua Kimmich|Luis Díaz|Leon Goretzka|Alphonso Davies|Dayot Upamecano|Kim Min-jae|Konrad Laimer|Serge Gnabry|Aleksandar Pavlović|Jonathan Tah|Hiroki Ito',
'Lucas Chevalier|Ousmane Dembélé|Vitinha|Achraf Hakimi|Marquinhos|Khvicha Kvaratskhelia|João Neves|Fabián Ruiz|Nuno Mendes|Bradley Barcola|Désiré Doué|Willian Pacho|Warren Zaïre-Emery|Gonçalo Ramos|Senny Mayulu',
'Alisson|Mohamed Salah|Virgil van Dijk|Florian Wirtz|Alexander Isak|Dominik Szoboszlai|Cody Gakpo|Ryan Gravenberch|Alexis Mac Allister|Ibrahima Konaté|Andy Robertson|Jeremie Frimpong|Milos Kerkez|Hugo Ekitike|Curtis Jones',
'Yann Sommer|Lautaro Martínez|Marcus Thuram|Nicolò Barella|Hakan Çalhanoğlu|Alessandro Bastoni|Federico Dimarco|Francesco Acerbi|Denzel Dumfries|Henrikh Mkhitaryan|Piotr Zieliński|Benjamin Pavard|Davide Frattesi|Carlos Augusto|Ange-Yoan Bonny',
'Ederson|Milan Škriniar|Youssef En-Nesyri','Mert Günok|Rafa Silva|Gedson Fernandes','David Raya|Bukayo Saka|Martin Ødegaard','Robert Sánchez|Cole Palmer|Enzo Fernández','André Onana|Bruno Fernandes|Bryan Mbeumo','Guglielmo Vicario|Mohammed Kudus|Dominic Solanke','Jan Oblak|Antoine Griezmann|Julián Álvarez','Unai Simón|Nico Williams|Oihan Sancet','Mark Flekken|Alejandro Grimaldo|Patrik Schick','Gregor Kobel|Serhou Guirassy|Julian Brandt','Michele Di Gregorio|Dušan Vlahović|Kenan Yıldız','Mike Maignan|Rafael Leão|Christian Pulisic','Alex Meret|Scott McTominay|Kevin De Bruyne','Mile Svilar|Paulo Dybala|Lorenzo Pellegrini','Marco Carnesecchi|Ademola Lookman|Mario Pašalić','Gerónimo Rulli|Mason Greenwood|Pierre-Emerick Aubameyang','Philipp Köhn|Takumi Minamino|Folarin Balogun','Lucas Perri|Alexandre Lacazette|Corentin Tolisso','Remko Pasveer|Mika Godts|Kenneth Taylor','Walter Benítez|Luuk de Jong|Johan Bakayoko','Anatoliy Trubin|Ángel Di María|Vangelis Pavlidis','Diogo Costa|Samu Aghehowa|Gabri Veiga','Rui Silva|Geovany Quenda|Maxi Araújo','Nick Pope|Bruno Guimarães|Anthony Gordon']].map(m=>m.map(s=>s.split('|')));
SQ.forEach(m=>m.forEach(a=>{while(a.length<15)a.push(nm())}));
let S={coins:0,own:[],cup:0,ucl:0,bd:0,gb:0,goals:0,tp:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('dk2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('dk2',JSON.stringify(S))}catch(e){}};
let mode=0,diff=1,me=0,opps=[],round=0,tg=0,G=null,keys={},joy={x:0,y:0},shootHeld=false,sprH=false,passH=false,swH=false,touch=(typeof navigator!=='undefined'&&navigator.maxTouchPoints>0)||('ontouchstart' in window);
const bonus=k=>S.own.filter(i=>STARS[i][3]==k).length+S.tp.filter(x=>x.t==k).length;
let AC;function snd(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function show(h){ov.classList.remove('hide');ctl(false);ov.innerHTML=h}
function home(){
 G=null;
 show(`<h1>⚽ Dünya Şampiyonası</h1><p>💰 ${S.coins} altın · ⚽ ${S.goals} gol</p><p>🏆 ${S.cup} · ⭐ ${S.ucl} · 👟 ${S.gb} · 🥇 ${S.bd}</p>
 <button class="btn" data-m="0">Dünya Kupası</button><button class="btn" data-m="1">Şampiyonlar Ligi</button>
 <div class="row"><button class="btn alt" id="shop">🛒 Mağaza</button><button class="btn alt" id="tm">🔁 Transfer</button><button class="btn alt" id="df">Zorluk: ${DN[diff]}</button></div>
 <p>Ok/WASD = hareket · Boşluk = şut · E = pas · Shift = koş · Q = oyuncu değiştir<br>🏆 Dünya Kupası · ⭐ Şampiyonlar Ligi · 👟 Altın Ayakkabı · 🥇 Ballon d’Or</p>`);
 ov.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;pick()});
 document.getElementById('shop').onclick=shop;document.getElementById('tm').onclick=market;
 document.getElementById('df').onclick=()=>{diff=(diff+1)%3;home()};
}
function shop(){
 show(`<h1>🛒 Mağaza</h1><p>💰 ${S.coins} altın</p>`+STARS.map((s,i)=>`<div class="item"><span><b>${s[0]}</b><br>${s[1]}</span><button data-i="${i}" ${S.own.includes(i)||S.coins<s[2]?'disabled':''}>${S.own.includes(i)?'Sahipsin':s[2]+' 💰'}</button></div>`).join('')+'<button class="btn" id="bk">Geri</button>');
 ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.coins>=STARS[i][2]&&!S.own.includes(i)){S.coins-=STARS[i][2];S.own.push(i);save();snd(800,.2);shop()}});
 document.getElementById('bk').onclick=home;
}
function pick(){
 const M=MODES[mode];
 show(`<h1>${M.n}</h1><p>Takımını seç</p><div class="grid">`+M.T.map((t,i)=>`<button class="t" data-i="${i}"><i style="background:${t[1]}"></i>${t[0]}</button>`).join('')+'</div><button class="btn alt" id="bk">Geri</button>');
 ov.querySelectorAll('.t').forEach(b=>b.onclick=()=>{me=+b.dataset.i;opps=M.T.map((_,i)=>i).filter(i=>i!=me).sort(()=>Math.random()-.5).slice(0,M.R.length);round=0;tg=0;squad()});
 document.getElementById('bk').onclick=home;
}
function out(k){
 const b=G.ball,P=G.p,last=G.last;let team,x,y,m;
 if(k=='aut'){team=1-last;x=Math.max(40,Math.min(W-40,b.x));y=b.y<H/2?10:H-10;m='AUT'}
 else{const left=k=='x0',def=left?0:1;
  if(last==def){team=1-def;x=left?10:W-10;y=b.y<H/2?10:H-10;m='KORNER'}
  else{team=def;x=left?60:W-60;y=H/2;m='KALE VURUŞU'}}
 b.x=x;b.y=y;b.vx=0;b.vy=0;
 const c=P.filter(q=>q.team==team&&q.role==(m=='KALE VURUŞU'?'k':'f')).reduce((a,q)=>dist(q,b)<dist(a,b)?q:a);
 c.x=x<W/2?x+14:x-14;c.y=m=='KALE VURUŞU'?y:y+(y<H/2?14:-14);c.vx=c.vy=0;
 G.pause=50;G.msg=m;snd(500,.15,'sine');
}
let MK=null;

function genMk(){MK=[];for(let i=0;i<8;i++){const t=['spd','pow','gk','pen'][Math.random()*4|0],r=60+Math.random()*35|0;MK.push({n:nm(),t,r,pr:Math.round(r*r/100)*5})}}
function market(){
 if(!MK)genMk();
 show(`<h1>🔁 Transfer Pazarı</h1><p>💰 ${S.coins} altın · Kadro: ${S.tp.length}/5</p>`+MK.map((m,i)=>`<div class="item"><span><b>${m.n}</b> (${m.r})<br>${POS[m.t]} · ${DSC[m.t]}</span><button data-b="${i}" ${S.coins<m.pr||S.tp.length>=5?'disabled':''}>${m.pr} 💰</button></div>`).join('')+'<p>Senin transferlerin:</p>'+(S.tp.length?S.tp.map((m,i)=>`<div class="item"><span><b>${m.n}</b> (${m.r})<br>${POS[m.t]} · ${DSC[m.t]}</span><button data-s="${i}">Sat ${Math.round(m.pr*.6)} 💰</button></div>`).join(''):'<p>Henüz yok</p>')+'<div class="row"><button class="btn alt" id="rf">Yenile (50 💰)</button><button class="btn" id="bk">Geri</button></div>');
 ov.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{const m=MK[+x.dataset.b];if(S.coins>=m.pr&&S.tp.length<5){S.coins-=m.pr;S.tp.push(MK.splice(+x.dataset.b,1)[0]);save();snd(800,.2);market()}});

 document.getElementById('bk').onclick=home;
}
let selSlot=-1;
function lineup(m,t){let a=S.lu&&S.lu[m+'-'+t];if(!a||a.length!=15)a=[...Array(15).keys()];return a}
function rate(m,t,oi){const n=SQ[m][t][oi];let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;const b=oi<5?10:0;return{s:Math.min(99,55+h%36+b),t:Math.min(99,55+(h>>>8)%36+b)}}
function squad(){
 const M=MODES[mode],a=lineup(mode,me);
 show(`<h1>${M.T[me][0]} Kadrosu</h1><p>İki oyuncuya dokunup yerlerini değiştir. İlk 3 sahada: 1. kaleci, 2-3 saha oyuncusu.</p><div id="sl" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px"></div><div class="row"><button class="btn" id="go">Maça Başla</button><button class="btn alt" id="bk">Geri</button></div>`);
 const L=document.getElementById('sl');
 a.forEach((oi,s)=>{const r=rate(mode,me,oi),d=document.createElement('div');d.className='item';d.style.cssText='cursor:pointer;'+(s==selSlot?'outline:2px solid #ffd23f;':'')+(s<3?'border-left:4px solid #ffd23f;':'');
  d.innerHTML=`<span><b>${s+1}. ${SQ[mode][me][oi]}</b><br>${s==0?'Kaleci':s<3?'Sahada':'Yedek'}</span><span>Hız ${r.s} · Şut ${r.t}</span>`;
  d.onclick=()=>{if(selSlot<0)selSlot=s;else{[a[selSlot],a[s]]=[a[s],a[selSlot]];S.lu=S.lu||{};S.lu[mode+'-'+me]=a;save();selSlot=-1}squad()};L.appendChild(d)});
 document.getElementById('go').onclick=()=>{selSlot=-1;start()};document.getElementById('bk').onclick=()=>{selSlot=-1;pick()};
}
function mk(team,x,y,role){return{x,y,vx:0,vy:0,team,role,hx:x,hy:y,fx:team?-1:1,fy:0}}
function reset(){
 const P=G.p;P.length=0;
 P.push(mk(0,28,H/2,'k'),mk(0,260,150,'f'),mk(0,260,330,'f'),mk(1,W-28,H/2,'k'),mk(1,W-260,150,'f'),mk(1,W-260,330,'f'));
 G.ball={x:W/2,y:H/2,vx:0,vy:0};G.pause=70;G.ctl=1;
}
